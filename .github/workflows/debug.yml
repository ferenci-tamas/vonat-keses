name: Debug

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        
      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::httr
        
      - name: Debug
        run: Rscript -e 'print(rvest::html_encoding_guess(httr::content(httr::GET("https://elvira.mav-start.hu/"), as = "raw")))'