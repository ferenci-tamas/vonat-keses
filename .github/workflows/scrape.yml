name: Napi update

on:
  schedule:
    - cron: '10 17 * * *'
      timezone: "Europe/Budapest"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    
    steps:
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        
      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::rvest
            any::progress
            any::purrr
            any::osmdata
            any::R.utils
            any::stringr
            any::arrow
            any::lubridate
            any::sf
            any::highcharter
            any::jsonlite
            any::markdown

      - name: Scrape
        run: Rscript -e 'source("vonat-keses-scraper.R")'

      - name: Commit raw data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/raw/raw*.rds || true
          git commit -m 'Individual raw data updated' || echo "No changes to commit"
          git push origin

      - name: Preprocess
        run: Rscript -e 'source("vonat-keses-preprocess.R")'

      - name: Commit processed results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/allomaskoord.rds || true
          git commit -m 'allomaskoord updated' || echo "No changes to commit"
          git add data/MetData.rds || true
          git commit -m 'MetData updated' || echo "No changes to commit"
          git add data/ProcData*.feather || true
          git commit -m 'ProcData updated' || echo "No changes to commit"
          git add data/RawData*.feather || true
          git commit -m 'RawData updated' || echo "No changes to commit"
          git add data/choices.rds || true
          git commit -m 'choices updated' || echo "No changes to commit"
          git add data/TrendAgg.rds || true
          git commit -m 'TrendAgg updated' || echo "No changes to commit"
          git add data/daterange.rds || true
          git commit -m 'daterange updated' || echo "No changes to commit"
          git add landing.html || true
          git commit -m 'landing updated' || echo "No changes to commit"
          git push origin
