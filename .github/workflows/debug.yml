name: Debug

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        
      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::httr

      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Debug
        run: Rscript -e 'rvest::read_html("https://elvira.mav-start.hu/", encoding = "ISO-8859-1")'