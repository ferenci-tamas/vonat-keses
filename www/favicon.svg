  <circle cx="22" cy="50" r="4.5" fill="#2c3e50"/>
  <circle cx="22" cy="50" r="2" fill="#7f8c8d"/>
  <circle cx="38" cy="50" r="4.5" fill="#2c3e50"/>
  <circle cx="38" cy="50" r="2" fill="#7f8c8d"/>
  <circle cx="46" cy="50" r="4.5" fill="#2c3e50"/>
